[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-traffic-redactor"
version = "0.1.0"
description = "Redacts sensitive data from NDJSON API traffic logs using YAML-defined rules."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["redactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
