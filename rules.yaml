# Redaction rules for API traffic logs.
version: 1

settings:
  mask:    { replacement: "****" }
  partial: { keep_last: 4, fill: "*" }
  hash:    { algorithm: sha256 }

# key_rules match on the NAME of a JSON key or HTTP header.
#   scope: headers | body | any
#   match: either { exact: [names...] } or { regex: "..." }
key_rules:
  - name: auth-headers
    scope: headers
    match:
      exact: [Authorization, Proxy-Authorization, X-Auth-Token, Cookie, Set-Cookie]
    action: mask

  - name: api-key-names
    scope: any
    match:
      regex: '(?i)^(x-)?api[_-]?key$'
    action: hash

  - name: secret-fields
    scope: body
    match:
      regex: '(?i)^(password|passwd|pwd|secret|client_secret|token)$'
    action: mask

  - name: card-number-fields
    scope: body
    match:
      regex: '(?i)^(card_?number|pan)$'
    action: partial

  - name: cvv-fields
    scope: body
    match:
      regex: '(?i)^(cvv|cvc|cvv2)$'
    action: remove

# value_rules match on the CONTENT of any string value, whatever its key is called.
#   validator (optional): the match only counts if the validator accepts it. Supported: luhn
value_rules:
  - name: email
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    action: hash

  - name: jwt
    # The three parts of a JWT are base64url (RFC 7515): "-" and "_" instead
    # of "+" and "/", and no "=" padding.
    pattern: 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*'
    action: mask

  # Card numbers. The structure decides where a number starts and ends, the
  # Luhn check decides whether it is a card. Neither is enough on its own.
  #   digits only   13 to 19 digits (the provided pattern)
  #   4-4-4-4       16 digits: Visa, Mastercard, Discover
  #   4-6-5         15 digits: American Express
  #   4-6-4         14 digits: Diners Club
  # Groups are separated by one space or one hyphen.
  #
  # There is deliberately no guard against text that looks like the tool's
  # own output (a run of "*" before the digits). Such a guard would leave a
  # real card readable whenever the input happens to look that way. The price
  # is a rare case in which a second run redacts more: see the README.
  - name: credit-card
    pattern: '\b(?:\d{13,19}|\d{4}[ -]\d{4}[ -]\d{4}[ -]\d{4}|\d{4}[ -]\d{6}[ -]\d{5}|\d{4}[ -]\d{6}[ -]\d{4})\b'
    validator: luhn
    action: partial

  # 4-4-4-4-3: a 19-digit card written in groups. It is a rule of its own
  # because "4111 1111 1111 1111 123" can be read in two ways: as one 19-digit
  # number, or as a 16-digit card followed by its CVV. A rule tries one
  # reading at each position, so each reading is a rule and Luhn decides
  # between them. If both pass, the engine merges them into one redaction.
  - name: credit-card-19-grouped
    pattern: '\b\d{4}[ -]\d{4}[ -]\d{4}[ -]\d{4}[ -]\d{3}\b'
    validator: luhn
    action: partial

  - name: api-key-prefix
    pattern: '\bsk_(?:live|test)_[A-Za-z0-9]+\b'
    action: mask
